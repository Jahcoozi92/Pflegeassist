    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-in-out; }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }

        .gradient-border {
            background: linear-gradient(45deg, #3b82f6, #10b981, #8b5cf6);
            padding: 2px;
            border-radius: 12px;
        }
        .gradient-border > div {
            background: #1e293b;
            border-radius: 10px;
        }

        #app-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            transition: opacity 0.5s ease-out;
        }
        #app-loading.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>

                                    'Hausarzt (werktags)',
                                    '116117 (Wochenende)',
                                    'Bewohner versorgen'
                                ],
                                time: '10 Min',
                                icon: 'Phone',
                                contact: '116117'
                            }
                        ],
                        next: []
                    }
                }
            }
        };

        // ==================== MAIN APP ====================
        const PflegeAssistPro = () => {
            const [currentScreen, setCurrentScreen] = useState('dashboard');
            const [currentFlow, setCurrentFlow] = useState(null);
            const [currentStep, setCurrentStep] = useState(null);
            const [stepHistory, setStepHistory] = useState([]);

            useEffect(() => {
                setTimeout(() => window.hideLoadingScreen(), 500);
            }, []);

            const startFlow = (flowId) => {
                const flow = decisionFlows[flowId];
                if (flow) {
                    setCurrentFlow(flow);
                    setCurrentStep(flow.steps.start);
                    setStepHistory([]);
                    setCurrentScreen('flow');
                }
            };

            const navigateToStep = (stepId) => {
                if (currentFlow && currentFlow.steps[stepId]) {
                    setStepHistory([...stepHistory, currentStep.id]);
                    setCurrentStep(currentFlow.steps[stepId]);
                }
            };

            const goBack = () => {
                if (stepHistory.length > 0) {
                    const previousStepId = stepHistory[stepHistory.length - 1];
                    setCurrentStep(currentFlow.steps[previousStepId]);
                    setStepHistory(stepHistory.slice(0, -1));
                }
            };

            const exitFlow = () => {
                setCurrentScreen('dashboard');
                setCurrentFlow(null);
                setCurrentStep(null);
                setStepHistory([]);
            };

            // Render Dashboard
            const renderDashboard = () => (
                <div className="min-h-screen bg-slate-900 pb-24 animate-fade-in">
                    <div className="bg-gradient-to-br from-slate-800 to-slate-900 border-b border-slate-700 px-6 py-8">
                        <h1 className="text-4xl font-bold bg-gradient-to-r from-blue-400 to-green-400 bg-clip-text text-transparent mb-2">
                            PflegeAssist Pro
                        </h1>
                        <p className="text-slate-400 text-lg">Vereinfachte Entscheidungshilfe</p>
                    </div>

                    <div className="px-6 py-8 space-y-6">
                        {Object.values(decisionFlows).map((flow) => (
                            <button
                                key={flow.id}
                                onClick={() => startFlow(flow.id)}
                                className={`w-full p-6 rounded-xl border-2 transition-all hover:scale-[1.02] text-left ${
                                    flow.color === 'red' ? 'bg-red-900/20 border-red-600/50' :
                                    flow.color === 'orange' ? 'bg-orange-900/20 border-orange-600/50' :
                                    'bg-blue-900/20 border-blue-600/50'
                                }`}
                            >
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-4">
                                        <div className="p-3 bg-black/20 rounded-xl">
                                            <Icon name={flow.icon} className="w-8 h-8" />
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-bold text-white">{flow.title}</h3>
                                            <p className="text-slate-300 text-sm">Einfache Anleitung</p>
                                        </div>
                                    </div>
                                    <Icon name="ChevronRight" className="w-6 h-6 text-slate-400" />
                                </div>
                            </button>
                        ))}
                    </div>
                </div>
            );

            // Render Flow (vereinfacht)
            const renderFlow = () => {
                if (!currentFlow || !currentStep) return null;

                const isQuestionStep = currentStep.type === 'question';
                const isActionStep = currentStep.type === 'action';

                return (
                    <div className="min-h-screen bg-slate-900 pb-24 animate-fade-in">
                        <div className="bg-gradient-to-r from-slate-800 to-slate-900 border-b border-slate-700 px-6 py-4 sticky top-0 z-10">
                            <div className="flex items-center justify-between">
                                <button onClick={stepHistory.length > 0 ? goBack : exitFlow} className="p-2 bg-slate-700 rounded-lg">
                                    <Icon name="ChevronLeft" className="w-5 h-5" />
                                </button>
                                <div className="flex-1 mx-4">
                                    <h2 className="text-lg font-bold text-white">{currentFlow.title}</h2>
                                </div>
                                <button onClick={exitFlow} className="px-4 py-2 bg-red-600 rounded-lg text-sm">
                                    Beenden
                                </button>
                            </div>
                        </div>

                        <div className="px-6 py-6">
                            {isQuestionStep && (
                                <div className="space-y-6">
                                    <div className="bg-slate-800 rounded-xl p-6">
                                        <h3 className="text-2xl font-bold text-white mb-3">{currentStep.question}</h3>
                                        {currentStep.info && (
                                            <div className="flex items-start space-x-2 text-slate-300 text-sm bg-blue-900/20 rounded-lg p-3 mt-3">
                                                <Icon name="Info" className="w-5 h-5 text-blue-400 flex-shrink-0" />
                                                <p>{currentStep.info}</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-4">
                                        {currentStep.options.map((option, index) => (
                                            <button
                                                key={index}
                                                onClick={() => navigateToStep(option.next)}
                                                className={`w-full p-5 rounded-xl border-2 hover:scale-[1.02] text-left ${
                                                    option.color === 'red' ? 'bg-red-900/20 border-red-600/50' :
                                                    option.color === 'orange' ? 'bg-orange-900/20 border-orange-600/50' :
                                                    option.color === 'yellow' ? 'bg-yellow-900/20 border-yellow-500/50' :
                                                    option.color === 'green' ? 'bg-green-900/20 border-green-600/50' :
                                                    'bg-blue-900/20 border-blue-600/50'
                                                }`}
                                            >
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center space-x-4">
                                                        <Icon name={option.icon} className="w-6 h-6" />
                                                        <span className="text-lg font-semibold text-white">{option.text}</span>
                                                    </div>
                                                    <Icon name="ChevronRight" className="w-5 h-5" />
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {isActionStep && (
                                <div className="space-y-6">
                                    <div className={`p-6 rounded-xl border-2 ${
                                        currentStep.priority === 'critical' ? 'bg-red-900/30 border-red-600' :
                                        currentStep.priority === 'high' ? 'bg-orange-900/30 border-orange-600' :
                                        'bg-blue-900/30 border-blue-600'
                                    }`}>
                                        <h3 className="text-2xl font-bold text-white">{currentStep.title}</h3>
                                    </div>

                                    {currentStep.actions.map((action, index) => (
                                        <div key={index} className={`bg-slate-800 border rounded-xl p-6 ${
                                            action.highlight ? 'border-green-500/50' :
                                            action.urgent ? 'border-red-500/50' :
                                            'border-slate-600'
                                        }`}>
                                            <h4 className="text-lg font-bold text-white mb-3">{action.title}</h4>
                                            <div className="space-y-2">
                                                {action.items.map((item, i) => (
                                                    <div key={i} className="flex items-start space-x-2">
                                                        <Icon name="CheckCircle" className="w-4 h-4 text-green-400 flex-shrink-0 mt-1" />
                                                        <span className="text-slate-300 text-sm">{item}</span>
                                                    </div>
                                                ))}
                                            </div>
                                            {action.contact && (
                                                <div className="mt-3">
                                                    <div className="px-4 py-2 bg-green-600 rounded-lg text-sm inline-flex items-center space-x-2">
                                                        <Icon name="Phone" className="w-4 h-4" />
                                                        <span>{action.contact}</span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    {currentStep.tips && (
                                        <div className="bg-green-900/20 border border-green-600/50 rounded-xl p-5">
                                            {currentStep.tips.map((tip, i) => (
                                                <p key={i} className="text-slate-300 text-sm">{tip}</p>
                                            ))}
                                        </div>
                                    )}

                                    {currentStep.next && currentStep.next.length > 0 && (
                                        <div className="space-y-3">
                                            <h4 className="font-bold text-white">Weiter:</h4>
                                            {currentStep.next.map((option, index) => {
                                                const isString = typeof option === 'string';
                                                const nextStepId = isString ? option : option.next;
                                                const nextStep = currentFlow.steps[nextStepId];

                                                return (
                                                    <button
                                                        key={index}
                                                        onClick={() => navigateToStep(nextStepId)}
                                                        className={`w-full p-4 rounded-xl border-2 hover:scale-[1.02] text-left ${
                                                            !isString && option.color === 'green' ? 'bg-green-900/20 border-green-600/50' :
                                                            !isString && option.color === 'red' ? 'bg-red-900/20 border-red-600/50' :
                                                            'bg-blue-900/20 border-blue-600/50'
                                                        }`}
                                                    >
                                                        <div className="flex items-center justify-between">
                                                            <span className="font-semibold text-white">
                                                                {isString ? (nextStep ? nextStep.title || nextStep.question : 'Weiter') : option.text}
                                                            </span>
                                                            <Icon name="ChevronRight" className="w-5 h-5" />
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {(!currentStep.next || currentStep.next.length === 0) && (
                                        <button onClick={exitFlow} className="w-full py-4 bg-green-600 rounded-xl font-bold text-lg">
                                            ✓ Abschließen
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="relative">
                    {currentScreen === 'dashboard' && renderDashboard()}
                    {currentScreen === 'flow' && renderFlow()}

                    {currentScreen !== 'flow' && (
                        <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-700">
                            <div className="grid grid-cols-2 text-center">
                                <button onClick={() => setCurrentScreen('dashboard')} className="py-4 text-blue-400 bg-slate-800">
                                    <Icon name="Home" className="w-6 h-6 mx-auto mb-1" />
                                    <span className="text-xs">Übersicht</span>
                                </button>
                                <button onClick={() => alert('Mini Car: 02407 2044')} className="py-4 text-slate-400 hover:text-white">
                                    <Icon name="Phone" className="w-6 h-6 mx-auto mb-1" />
                                    <span className="text-xs">Mini Car</span>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        console.log('Mounting PflegeAssist Pro V3...');
        ReactDOM.render(<PflegeAssistPro />, document.getElementById('root'));
        console.log('✓ Application V3 mounted!');
    </script>
</body>
</html>
